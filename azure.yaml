name: mcp-azure-pdf
metadata:
  template: mcp-azure-pdf@0.0.1-beta
location: swedencentral

services:
  api:
    project: .
    language: ts
    host: containerapp
    hooks:
      prepackage:
        shell: pwsh
        run: |
          npm run build
          npm ci --only=production

infra:
  provider:
    type: bicep